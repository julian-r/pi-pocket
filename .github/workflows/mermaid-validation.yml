name: Mermaid PR validation
on:
    push:
        branches: [ci/mermaid-validation]
permissions:
    contents: read
env:
    PI_POCKET_BROWSER: /usr/bin/google-chrome
jobs:
    checks:
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm ci
            - run: npm run format:check && npm run lint && npm run check
            - run: npm ci && npm run check
              working-directory: docs-site
    core-tests:
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm ci
            - run: '"$PI_POCKET_BROWSER" --version'
            - name: Sandboxed headless Chrome smoke test
              run: >-
                  timeout 20s "$PI_POCKET_BROWSER" --headless --no-first-run
                  --user-data-dir="$RUNNER_TEMP/chrome-smoke" --dump-dom about:blank
            - run: npm test 2>&1 | tee core-tests.log
              shell: bash -o pipefail {0}
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: core-test-log
                  path: core-tests.log
    mermaid-tests:
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm ci
            - run: '"$PI_POCKET_BROWSER" --version'
            - name: Sandboxed headless Chrome smoke test
              run: >-
                  timeout 20s "$PI_POCKET_BROWSER" --headless --no-first-run
                  --user-data-dir="$RUNNER_TEMP/chrome-smoke" --dump-dom about:blank
            - run: npm ci && npm run build && npm run check && npm test
              working-directory: contrib/mermaid
